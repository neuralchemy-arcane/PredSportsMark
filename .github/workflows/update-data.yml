name: update-data

on:
  schedule:
    - cron: '0 6 */2 * *'   # every 2 days at 06:00 UTC
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch SerpApi + odds data
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          LEAGUE_KGMID: ${{ vars.LEAGUE_KGMID }}
          MAX_TEAMS: ${{ vars.MAX_TEAMS }}
          TYPE_LEAGUE: ${{ vars.TYPE_LEAGUE }}
          TYPE_TEAM: ${{ vars.TYPE_TEAM }}
        run: node tools/fetch-data.mjs

      - name: Commit data
        run: |
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data || true
          git diff --cached --quiet || { git commit -m "data: $(date -u +%FT%TZ)"; git push; }
