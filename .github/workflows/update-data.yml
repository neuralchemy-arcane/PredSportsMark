name: update-data

on:
  schedule:
    - cron: '0 6 */2 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch fixtures, form, and odds
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          LEAGUE_KGMID: ${{ vars.LEAGUE_KGMID }}
          MAX_TEAMS: ${{ vars.MAX_TEAMS }}
          API_FOOTBALL_LEAGUES: ${{ vars.API_FOOTBALL_LEAGUES }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD }}
        run: node tools/fetch-data.mjs

      - name: Commit data
        run: |
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data || true
          git diff --cached --quiet || { git commit -m "data: $(date -u +%FT%TZ)"; git push; }
